<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Grocery</title>
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="icon" type="image/x-icon" href="Favicon- Noah Grocery.ico">
</head>
<body>

    <main>
        <header>      
            <div class="container">
                <img src="Noah Grocery Logo.png" class="logo">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="support.html">Support</a></li>
                        <li><a href="cart.html" id="cartLink">Cart(0)</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        
        <section id="banner">
            <div class="container">
                <center>
                    <div class="banner-text">
                        <h2>Welcome to Noah Grocery</h2>
                        <p>Your one-stop shop for fresh and quality groceries at great prices.</p>
                    </div>
                    <a href="shop.html" class="button">Shop Now</a>
                </center>
            </div>
        </section>

        <section id="featured">
            <div class="container">
                <h2>Featured Products</h2>
                <div class="products" id="featuredProductsContainer">
                    <!-- Featured products will be dynamically added here -->
                </div>
            </div>
        </section>
       
        <section id="footer">
            <div class="container">
                <h2>Subscribe to Our Newsletter</h2>
                <form>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">
                    <button class="subscribe">Subscribe</button>
                </form>
            </div>
        </section>

        <footer>
            <p>&copy; 2023 Noah Grocery. All rights reserved.</p>
        </footer>
    </main>

    <script>

    document.addEventListener('DOMContentLoaded', function () {
        const productsContainer = document.querySelector('.products');

        // Fetch products from shop.html
        fetch('shop.html')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const shopDoc = parser.parseFromString(html, 'text/html');
                const allProducts = Array.from(shopDoc.querySelectorAll('.product'));

                // Shuffle the products array
                const shuffledProducts = shuffle(allProducts).slice(0, 3);

                // Initialize featured products on page load
                renderProducts(shuffledProducts);
            })
            .catch(error => console.error('Error fetching shop.html:', error));

        // Render products function
        function renderProducts(products) {
            productsContainer.innerHTML = '';
            products.forEach((product) => {
                productsContainer.appendChild(product.cloneNode(true));
            });
        }

        // Shuffle array function
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;

            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }

            return array;
        }
    });


    document.addEventListener('DOMContentLoaded', function() {
        const cartLink = document.getElementById('cartLink');
        updateCartCount();

        function updateCartCount() {
            // Fetch the cart items from local storage or initialize an empty array
            const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            const cartCount = cartItems.length;

            // Update cart count in the navbar
            cartLink.textContent = `Cart(${cartCount})`;
        }
    });

    </script>

</body>
</html>
